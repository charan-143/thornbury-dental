<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thornbury Dental</title>
  <meta name="description" content="Dental practice site with a patient portal and a clinician workspace: appointments, pre and post treatment plans, prescriptions, medication reminders and reports.">
  <meta name="color-scheme" content="light dark">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500;600&display=swap">

  <!-- Phosphor, the single icon family used across the project. No hand-drawn glyphs. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">

  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/site.css">
  <link rel="stylesheet" href="assets/css/portal.css">

  <style>
    /* Printing is only ever used for the prescription sheet. */
    @media print {
      body { background: #fff; }
      .nav, .side, .topbar, .footer, .demo-strip, #toasts, .modal-foot, .modal-head [data-close] { display: none !important; }
      .modal-scrim { position: static; background: none; padding: 0; }
      .modal { box-shadow: none; border: none; max-height: none; width: 100%; }
      .card { border: 1px solid #ccc; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to the main content</a>

  <p class="demo-strip">
    A demonstration build with invented records. Do not enter real patient information.
  </p>

  <div id="app"></div>
  <div id="toasts" role="status" aria-live="polite"></div>

  <noscript>
    <div class="wrap" style="padding-block:48px">
      <h1>Thornbury Dental</h1>
      <p style="margin-top:12px">
        This portal needs JavaScript to run. To book an appointment without it, telephone the
        practice on +1 (503) 224-7700, Monday to Thursday 08:00 to 18:00, and Friday until 15:30.
      </p>
    </div>
  </noscript>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
